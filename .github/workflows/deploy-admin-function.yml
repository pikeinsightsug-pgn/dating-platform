# Deploys the owner-only admin-members Edge Function to the existing Supabase project, straight
# from this repository, so the deployed code always matches the reviewed branch.
# It deploys function code only: it never runs SQL and never touches member data.
#
# One-time setup (repository owner): Supabase Dashboard → Account → Access Tokens → Generate new
# token, then GitHub → Settings → Secrets and variables → Actions → New repository secret named
# SUPABASE_ACCESS_TOKEN. The token is never printed. ADMIN_EMAIL stays in Supabase's own secrets.
name: Deploy admin-members Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main, fix/launch-readiness]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-admin-function.yml"

permissions:
  contents: read

concurrency:
  group: deploy-admin-members
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cyvkpcwjkeifpvegwhpt
    steps:
      - name: Check the deploy token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the comment at the top of this file), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Confirm JWT verification stays enabled
        run: grep -A2 '^\[functions.admin-members\]' supabase/config.toml | grep -q 'verify_jwt = true'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy admin-members
        run: supabase functions deploy admin-members --project-ref "$PROJECT_REF" --use-api
      - name: Show the deployed version
        run: grep -o 'FUNCTION_VERSION = "[^"]*"' supabase/functions/admin-members/index.ts
