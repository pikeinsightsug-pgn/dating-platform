<script>
// One-tap unsubscribe from the "you have an unread message" emails. The link carries a private
// token only; no sign-in is needed and nothing else about the account changes.
(async function () {
  "use strict";
  const title = document.getElementById("title"), text = document.getElementById("text");
  function show(heading, message) { title.textContent = heading; text.textContent = message; }
  const token = new URLSearchParams(location.search).get("t") || "";
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)) {
    show("This link is incomplete", "Please tap the Unsubscribe link in the email again, or email pikeinsightsug@gmail.com and we will turn the emails off for you.");
    return;
  }
  const db = window.FYP && window.FYP.createClient();
  try {
    if (!db) throw new Error("offline");
    const { data, error } = await db.rpc("unsubscribe_unread_emails", { p_token: token });
    if (error) throw error;
    if (data === true) show("You're unsubscribed ✅", "You will no longer get emails about unread messages. Your account and messages are unchanged, and you can still see new messages when you log in.");
    else show("This link has expired", "Please email pikeinsightsug@gmail.com and we will turn the emails off for you.");
  } catch (error) {
    show("Something went wrong", "Please check your internet connection and open the link again, or email pikeinsightsug@gmail.com.");
  }
})();
</script>
